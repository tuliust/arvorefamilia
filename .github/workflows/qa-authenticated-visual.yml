name: QA autenticado visual

on:
  push:
    branches:
      - qa/authenticated-visual-20260927

permissions:
  contents: read
  id-token: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: http://127.0.0.1:4173
      QA_PROD_URL: https://familiasouzabarros.com.br
      VITE_SUPABASE_URL: https://jimymkzejbhuseozunxl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_hm6ZfkkpzWl6qAoZnQA-kg_68P53935
      QA_SESSION_FILE: qa-session.json
      QA_OUT_DIR: qa-artifacts
      QA_FUNCTION_URL: https://jimymkzejbhuseozunxl.supabase.co/functions/v1/qa-authenticated-session-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const allowed = new Set(['.md', '.txt', '.json', '.sql']);
          const bad = [];
          const walk = dir => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name)) && fs.readFileSync(full, 'utf8').includes('\uFFFD')) bad.push(full);
            }
          };
          walk('docs');
          fs.mkdirSync(process.env.QA_OUT_DIR, { recursive: true });
          fs.writeFileSync(
            process.env.QA_OUT_DIR + '/mojibake-docs.json',
            JSON.stringify({ files_with_replacement_character: bad }, null, 2),
          );
          if (bad.length) console.warn('U+FFFD encontrado em:', bad.join(', '));
          NODE

          npm run typecheck
          npm test
          npm run build
          npm run test:e2e

      - name: Compare production deployment with current build
        if: always()
        shell: bash
        run: |
          mkdir -p "$QA_OUT_DIR"
          curl -fsSL "$QA_PROD_URL/" -o /tmp/qa-production-index.html || true

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const localHtml = fs.existsSync('dist/index.html') ? fs.readFileSync('dist/index.html', 'utf8') : '';
          const prodHtml = fs.existsSync('/tmp/qa-production-index.html') ? fs.readFileSync('/tmp/qa-production-index.html', 'utf8') : '';
          const asset = html => html.match(/assets\/index-[^"'\\s>]+\.js/)?.[0] ?? null;
          const localAsset = asset(localHtml);
          const productionAsset = asset(prodHtml);

          fs.writeFileSync(
            process.env.QA_OUT_DIR + '/production-freshness.json',
            JSON.stringify({
              checked_at: new Date().toISOString(),
              production_url: process.env.QA_PROD_URL,
              local_asset: localAsset,
              production_asset: productionAsset,
              same_asset: Boolean(localAsset && productionAsset && localAsset === productionAsset),
            }, null, 2),
          );
          NODE

      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('arvorefamilia-qa');
            core.setSecret(token);
            fs.writeFileSync('/tmp/github-oidc-token', token, { mode: 0o600 });

      - name: Create isolated QA sessions
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/github-oidc-token)"
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"setup"}' \
            "$QA_FUNCTION_URL" \
            -o "$QA_SESSION_FILE"

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.QA_SESSION_FILE, 'utf8'));
          if (payload.error) throw new Error(payload.error);
          for (const session of [payload.admin?.session, payload.onboarding?.session]) {
            if (!session?.access_token || !session?.refresh_token) {
              throw new Error('Sessão temporária de QA inválida.');
            }
            console.log('::add-mask::' + session.access_token);
            console.log('::add-mask::' + session.refresh_token);
          }
          NODE

      - name: Run authenticated visual QA on current build
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qa-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            if curl -fsS "$QA_BASE_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$QA_BASE_URL/" >/dev/null

          node scripts/qa-authenticated-visual.mjs

      - name: Preserve preview log
        if: always()
        shell: bash
        run: |
          mkdir -p "$QA_OUT_DIR"
          cp /tmp/qa-preview.log "$QA_OUT_DIR/preview.log" 2>/dev/null || true

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-authenticated-visual
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup isolated QA data
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f "$QA_SESSION_FILE" ] || [ ! -f /tmp/github-oidc-token ]; then
            exit 0
          fi

          TOKEN="$(cat /tmp/github-oidc-token)"
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"cleanup"}' \
            "$QA_FUNCTION_URL" \
            -o /tmp/qa-cleanup-result.json
