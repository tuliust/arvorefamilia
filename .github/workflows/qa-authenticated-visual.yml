name: QA autenticado visual

on:
  push:
    branches:
      - qa/authenticated-visual-20260927

permissions:
  contents: read
  id-token: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_BASE_URL: https://familiasouzabarros.com.br
      QA_SESSION_FILE: qa-session.json
      QA_OUT_DIR: qa-artifacts
      QA_FUNCTION_URL: https://jimymkzejbhuseozunxl.supabase.co/functions/v1/qa-authenticated-session-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('arvorefamilia-qa');
            core.setSecret(token);
            fs.writeFileSync('/tmp/github-oidc-token', token, { mode: 0o600 });

      - name: Create isolated QA sessions
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/github-oidc-token)"
          curl -fsS             -H "Authorization: Bearer ${TOKEN}"             -H "Content-Type: application/json"             -d '{"action":"setup"}'             "$QA_FUNCTION_URL"             -o "$QA_SESSION_FILE"

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.QA_SESSION_FILE, 'utf8'));
          if (payload.error) throw new Error(payload.error);
          for (const session of [payload.admin?.session, payload.onboarding?.session]) {
            if (!session?.access_token || !session?.refresh_token) {
              throw new Error('Sessão temporária de QA inválida.');
            }
            console.log('::add-mask::' + session.access_token);
            console.log('::add-mask::' + session.refresh_token);
          }
          NODE

      - name: Run authenticated visual QA
        run: node scripts/qa-authenticated-visual.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-authenticated-visual
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup isolated QA data
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f "$QA_SESSION_FILE" ] || [ ! -f /tmp/github-oidc-token ]; then
            exit 0
          fi

          node <<'NODE' > /tmp/qa-cleanup.json
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.QA_SESSION_FILE, 'utf8'));
          process.stdout.write(JSON.stringify({
            action: 'cleanup',
            admin_user_id: payload.admin?.user_id ?? null,
            onboarding_user_id: payload.onboarding?.user_id ?? null,
            temp_person_id: payload.onboarding?.pessoa_id ?? null,
          }));
          NODE

          TOKEN="$(cat /tmp/github-oidc-token)"
          curl -fsS             -H "Authorization: Bearer ${TOKEN}"             -H "Content-Type: application/json"             --data-binary @/tmp/qa-cleanup.json             "$QA_FUNCTION_URL"             -o /tmp/qa-cleanup-result.json
